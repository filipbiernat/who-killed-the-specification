name: ai-review

# A second reader for the requirements themselves, since no linter can judge
# whether a sentence means one thing.
#
# This workflow comments and never blocks. Merging is gated by spec-check,
# which is deterministic. A reviewer that argues is useful; a reviewer that
# argues and also holds the keys is not. For the same reason the agent only
# reads and answers: the step after it posts the comments, so what reaches
# the pull request is decided by this file, not by the model.

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'tests/**'
      - 'src/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review the specification
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # The head, not the merge commit: the line numbers in the comments have
      # to be the ones GitHub shows on the right-hand side of the diff.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Ask mode: the agent can read the repository but cannot change a file
      # or run a command. It gets the diff instead of a shell.
      - name: Ask the agent for a review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            cat <<'EOF'
          Review the requirements changed in this pull request. The house
          rules are in AGENTS.md; read them first and judge against them
          rather than against your own preferences. The diff is at the end
          of this message; read any other file you need.

          For every changed requirement in spec/, answer these in order and
          raise a comment on the offending line where the answer is no:

          1. Does the sentence contain exactly one `shall`? Two means it is
             two requirements sharing a UID.
          2. Does it follow one of the five EARS patterns, and is it the
             right one? `when` is for an expected trigger, `if` is for a
             condition nobody wants.
          3. Is it decidable? Could two engineers disagree about whether the
             machine complied? Quote the words that leave room.
          4. Does it describe behaviour rather than implementation? A named
             class, function or file means it has drifted into design.
          5. Does `references:` name a test file, and does a test in that
             file carry a matching `@pytest.mark.requirement` marker?

          Then judge the tests: does each assertion correspond to the
          `shall` clause of the requirement it claims to verify, or does it
          assert something adjacent that would pass even if the requirement
          were broken?

          Answer with one JSON object and nothing else:

          {
            "comments": [
              {"path": "spec/REQ-BREW-021.md", "line": 22, "body": "..."}
            ],
            "summary": "..."
          }

          `line` is the line number in the new version of the file, and it
          must be a line added or changed in the diff. `summary` has one
          line per requirement with a verdict of pass, partial or fail, and
          the single most important thing to fix.

          ## The diff under review
          EOF
            echo '```diff'
            git diff "$BASE_SHA"...HEAD -- spec tests src
            echo '```'
          } > "$RUNNER_TEMP/prompt.md"
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::The CURSOR_API_KEY secret is not set for this repository."
            exit 1
          fi
          if ! cursor-agent --disable-auto-update -p --mode ask --trust --output-format text \
              "$(cat "$RUNNER_TEMP/prompt.md")" > "$RUNNER_TEMP/review.txt" 2> "$RUNNER_TEMP/agent.err"; then
            cat "$RUNNER_TEMP/agent.err" "$RUNNER_TEMP/review.txt"
            echo "::error::cursor-agent failed: $(cat "$RUNNER_TEMP/agent.err" "$RUNNER_TEMP/review.txt" | head -c 400 | tr '\n' ' ')"
            exit 1
          fi
          cat "$RUNNER_TEMP/review.txt"

      - name: Post the review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - "$RUNNER_TEMP/review.txt" <<'EOF'
          import json, os, re, subprocess, sys

          text = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r"\{.*\}", text, re.S)
          if not match:
              sys.exit("the agent did not answer with a JSON object")
          review = json.loads(match.group(0))

          repo, pr = os.environ["REPO"], os.environ["PR"]
          comments = [
              {"path": c["path"], "line": int(c["line"]), "side": "RIGHT", "body": c["body"]}
              for c in review.get("comments", [])
          ]
          payload = {
              "commit_id": os.environ["HEAD_SHA"],
              "event": "COMMENT",
              "body": review["summary"],
              "comments": comments,
          }
          posted = subprocess.run(
              ["gh", "api", f"repos/{repo}/pulls/{pr}/reviews", "--input", "-"],
              input=json.dumps(payload), text=True, capture_output=True,
          )
          if posted.returncode == 0:
              sys.exit(0)

          # One line outside the diff rejects the whole review. Keep the words
          # and lose the anchors rather than lose the review.
          print(posted.stderr)
          body = review["summary"] + "".join(
              f"\n\n**{c['path']}:{c['line']}** {c['body']}" for c in comments
          )
          subprocess.run(["gh", "pr", "comment", pr, "--repo", repo, "--body", body], check=True)
          EOF
